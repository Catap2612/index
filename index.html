<header><button id=bk hidden data-a=back>‹ Atrás</button><span id=ti>Amarres AP · Terreno</span></header>
<main id=m></main>

<script>/* NÚCLEO: estado global, constantes y utilidades puras. */
const ESQUEMA=1,APP_VERSION='1.3.0'; // ESQUEMA: versión del contrato de datos (ver docs/ESQUEMA_DATOS.md)
const $=s=>document.querySelector(s),m=$('#m');
let db,S={trafos:[],inv:[],reg:[],usuario:''},RM=new Map,V={v:'list',p:null,q:''},d=null,GP=null,ZOOM=0.0008;
const LBL={coincide:'Coincide',novedad:'Con novedad',no_encontrada:'No encontrada',nueva:'Nueva',otro_trafo:'De otro trafo',sin_serie:'Sin serie'};
const TIT={inventario:'Validar luminaria',nueva:'Luminaria nueva',otro_trafo:'Luminaria de otro transformador',sin_serie:'Luminaria sin serie legible'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null};
</script>
<script>/* DATOS: única puerta de acceso a IndexedDB. Esquema v1; nuevas versiones se migran en onupgradeneeded. */
/* ---------- IndexedDB ---------- */
function open(){return new Promise((ok,ko)=>{const r=indexedDB.open('apterreno',2);r.onupgradeneeded=()=>{const x=r.result;for(const[n,k]of[['trafos','codigo'],['inv','_k'],['reg','id'],['fotos','id'],['meta','k'],['mapas','id']])if(!x.objectStoreNames.contains(n))x.createObjectStore(n,{keyPath:k})};r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>ko(r.error)})}
const rq=r=>new Promise((ok,ko)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)});
const st=(s,w)=>db.transaction(s,w?'readwrite':'readonly').objectStore(s);
const all=s=>rq(st(s).getAll()),put=(s,v)=>rq(st(s,1).put(v)),get=(s,k)=>rq(st(s).get(k)),del=(s,k)=>rq(st(s,1).delete(k)),clr=s=>rq(st(s,1).clear());
async function load(){[S.trafos,S.inv,S.reg]=await Promise.all([all('trafos'),all('inv'),all('reg')]);const ul=await get('meta','ultimo');S.ultimo=ul?ul.v:'';const u=await get('meta','usuario');S.usuario=u?u.v:'';RM=new Map(S.reg.filter(r=>r.invKey).map(r=>[r.invKey,r]));S.trafos.sort((a,b)=>a.codigo.localeCompare(b.codigo,'es',{numeric:true}))}
</script>
<script>/* SERVICIOS DE DISPOSITIVO: GPS y compresión de fotos. */
/* ---------- utilidades ---------- */
const gps=()=>new Promise(ok=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>ok({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy),ts:new Date().toISOString()}),()=>ok(null),{enableHighAccuracy:true,timeout:20000,maximumAge:0}):ok(null));
function comp(f){return new Promise(ok=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(i.src);c.toBlob(ok,'image/jpeg',.7)};i.src=URL.createObjectURL(f)})}
</script>
<script>/* SERVICIO ZIP: empaquetado sin dependencias externas. */
/* ---------- ZIP (sin compresión) ---------- */
const CT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=u=>{let c=-1;for(let i=0;i<u.length;i++)c=CT[(c^u[i])&255]^(c>>>8);return(~c)>>>0};
function zip(files){const enc=new TextEncoder(),parts=[],cd=[];let off=0;const D=new Date(),dt=(D.getFullYear()-1980)<<9|(D.getMonth()+1)<<5|D.getDate(),tm=D.getHours()<<11|D.getMinutes()<<5|D.getSeconds()>>1;
for(const f of files){const n=enc.encode(f.n),c=crc(f.d),s=f.d.length;
const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,1);h.setUint16(4,20,1);h.setUint16(6,0x800,1);h.setUint16(10,tm,1);h.setUint16(12,dt,1);h.setUint32(14,c,1);h.setUint32(18,s,1);h.setUint32(22,s,1);h.setUint16(26,n.length,1);parts.push(h.buffer,n,f.d);
const e=new DataView(new ArrayBuffer(46));e.setUint32(0,0x02014b50,1);e.setUint16(4,20,1);e.setUint16(6,20,1);e.setUint16(8,0x800,1);e.setUint16(12,tm,1);e.setUint16(14,dt,1);e.setUint32(16,c,1);e.setUint32(20,s,1);e.setUint32(24,s,1);e.setUint16(28,n.length,1);e.setUint32(42,off,1);cd.push(e.buffer,n);off+=30+n.length+s}
const cs=cd.reduce((a,b)=>a+b.byteLength,0),z=new DataView(new ArrayBuffer(22));z.setUint32(0,0x06054b50,1);z.setUint16(8,files.length,1);z.setUint16(10,files.length,1);z.setUint32(12,cs,1);z.setUint32(16,off,1);
return new Blob([...parts,...cd,z.buffer],{type:'application/zip'})}
</script>
<script>/* SERVICIO DE MAPA DE FONDO: teselas XYZ (z/x/y) desde un paquete ZIP cargado en el teléfono (sin conexión) o desde OpenStreetMap en línea.
   Es una capa independiente del inventario: se puede cambiar o actualizar sin tocar luminarias ni transformadores. */
const FONDO={modo:'ninguno',zmin:0,zmax:19,n:0,nombre:'',atrib:'',blob:null,idx:null,redibujar:null,cache:new Map,_r:0};
const tilesX=(g,z)=>Math.floor((g+180)/360*2**z);
const tilesY=(a,z)=>{const r=a*Math.PI/180;return Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*2**z)};
const tLng=(x,z)=>x/2**z*360-180;
const tLat=(y,z)=>Math.atan(Math.sinh(Math.PI*(1-2*y/2**z)))*180/Math.PI;
const zoomDe=v=>Math.log2(360*Math.cos(v.lat*Math.PI/180)*v.s/256);
async function indexarZip(blob){const base=Math.max(0,blob.size-70000),tail=new DataView(await blob.slice(base).arrayBuffer());let e=-1;
for(let i=tail.byteLength-22;i>=0;i--)if(tail.getUint32(i,true)===0x06054b50){e=i;break}if(e<0)throw new Error('no es un ZIP válido');
let n=tail.getUint16(e+10,true),cs=tail.getUint32(e+12,true),co=tail.getUint32(e+16,true);
if(n===0xFFFF||co===0xFFFFFFFF){let l=-1;for(let i=e-20;i>=0;i--)if(tail.getUint32(i,true)===0x07064b50){l=i;break}if(l<0)throw new Error('ZIP64 incompleto');
const off=Number(tail.getBigUint64(l+8,true)),h=new DataView(await blob.slice(off,off+56).arrayBuffer());n=Number(h.getBigUint64(32,true));cs=Number(h.getBigUint64(40,true));co=Number(h.getBigUint64(48,true))}
const cd=new DataView(await blob.slice(co,co+cs).arrayBuffer()),dc=new TextDecoder(),idx=new Map;let p=0,zmin=99,zmax=0;
while(p+46<=cd.byteLength&&cd.getUint32(p,true)===0x02014b50){const m=cd.getUint16(p+10,true),c=cd.getUint32(p+20,true),nl=cd.getUint16(p+28,true),xl=cd.getUint16(p+30,true),kl=cd.getUint16(p+32,true),o=cd.getUint32(p+42,true),
nom=dc.decode(new Uint8Array(cd.buffer,p+46,nl)),r=/(\d+)\/(\d+)\/(\d+)\.(png|jpe?g|webp)(\.tile)?$/i.exec(nom);
if(r){const z=+r[1];idx.set(z+'/'+r[2]+'/'+r[3],[o,c,m]);zmin=Math.min(zmin,z);zmax=Math.max(zmax,z)}p+=46+nl+xl+kl}
return{idx,zmin,zmax}}
async function leerTilePaquete(z,x,y){const e=FONDO.idx.get(z+'/'+x+'/'+y);if(!e)return null;const[o,c,m]=e,h=new DataView(await FONDO.blob.slice(o,o+30).arrayBuffer()),ini=o+30+h.getUint16(26,true)+h.getUint16(28,true);
let b=FONDO.blob.slice(ini,ini+c);if(m===8)b=await new Response(b.stream().pipeThrough(new DecompressionStream('deflate-raw'))).blob();return createImageBitmap(b)}
function pedirTile(z,x,y){const C=FONDO.cache,k=FONDO.modo+z+'/'+x+'/'+y;if(C.has(k))return C.get(k);C.set(k,null);if(C.size>400)C.delete(C.keys().next().value);
const fin=im=>{if(im){C.set(k,im);if(FONDO.redibujar)FONDO.redibujar()}};
if(FONDO.modo==='paquete')leerTilePaquete(z,x,y).then(fin).catch(()=>{});
else if(FONDO.modo==='linea'){const i=new Image();i.onload=()=>fin(i);i.src='https://tile.openstreetmap.org/'+z+'/'+x+'/'+y+'.png'}return null}
function fondoTiles(x,v,W,H){if(FONDO.modo!=='paquete'&&FONDO.modo!=='linea')return;if(FONDO.modo==='paquete'&&!FONDO.idx)return;
const k=Math.cos(v.lat*Math.PI/180);let z=Math.round(zoomDe(v));z=FONDO.modo==='paquete'?Math.min(Math.max(z,FONDO.zmin),FONDO.zmax):Math.min(Math.max(z,3),19);
const x0=tilesX(v.lng-W/2/(k*v.s),z),x1=tilesX(v.lng+W/2/(k*v.s),z),y0=tilesY(v.lat+H/2/v.s,z),y1=tilesY(v.lat-H/2/v.s,z);if((x1-x0+1)*(y1-y0+1)>90)return;
for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){const im=pedirTile(z,tx,ty);if(!im)continue;const a=proyectar(v,{lat:tLat(ty,z),lng:tLng(tx,z)},W,H),b=proyectar(v,{lat:tLat(ty+1,z),lng:tLng(tx+1,z)},W,H);x.drawImage(im,a.x,a.y,b.x-a.x+.5,b.y-a.y+.5)}
const t=FONDO.modo==='linea'?'© OpenStreetMap contributors':FONDO.atrib;if(t){x.font='11px sans-serif';const w=x.measureText(t).width+8;x.fillStyle='rgba(255,255,255,.8)';x.fillRect(W-w,H-16,w,16);x.fillStyle='#10202b';x.fillText(t,W-w+4,H-4)}}
async function cargarFondo(){const m=await get('mapas','base'),f=await get('meta','fondo');FONDO.cache.clear();
if(m)Object.assign(FONDO,{blob:m.blob,idx:m.idx,zmin:m.zmin,zmax:m.zmax,n:m.idx.size,nombre:m.nombre,atrib:m.atrib});
FONDO.modo=f?f.v:(m?'paquete':'ninguno');if(FONDO.modo==='paquete'&&!FONDO.idx)FONDO.modo='ninguno'}
function initFondoUI(){const s=$('#fo'),i=$('#fi2'),pint=()=>{i.textContent=(FONDO.idx?'Mapa cargado: '+FONDO.nombre+' · '+FONDO.n+' teselas · zoom '+FONDO.zmin+'–'+FONDO.zmax:'No hay mapa cargado.')+(FONDO.modo==='linea'?' «En línea» solo funciona con conexión.':'')};s.value=FONDO.modo;pint();
s.onchange=async()=>{if(s.value==='paquete'&&!FONDO.idx){alert('Primero cargue un mapa sin conexión.');s.value=FONDO.modo;return}FONDO.modo=s.value;FONDO.cache.clear();await put('meta',{k:'fondo',v:FONDO.modo});pint()};
$('#fm').onchange=async e=>{const f=e.target.files[0];if(!f)return;i.textContent='Leyendo mapa…';
try{const r=await indexarZip(f);if(!r.idx.size)throw new Error('el ZIP no contiene teselas con estructura z/x/y.png');const atrib=prompt('Texto de atribución que se mostrará sobre el mapa:','© OpenStreetMap contributors')||'';
await put('mapas',{id:'base',nombre:f.name,blob:f,idx:r.idx,zmin:r.zmin,zmax:r.zmax,atrib});await put('meta',{k:'fondo',v:'paquete'});await cargarFondo();s.value=FONDO.modo}catch(err){alert('No se pudo cargar el mapa: '+err.message)}pint()}}
</script>
<script>/* SERVICIO DE IMPORTACIÓN: CSV/JSON → transformadores e inventario. */
const nk=x=>String(x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
const pk=(o,...ks)=>{for(const k of ks)for(const x in o)if(nk(x)===k&&o[x]!==''&&o[x]!=null)return o[x];return ''};
function dec(buf){try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch{return new TextDecoder('windows-1252').decode(buf)}}
function csv(t){t=t.replace(/^\ufeff/,'');const first=t.split(/\r?\n/)[0],sep=[';','\t',','].map(c=>[c,first.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
const R=[];let r=[],c='',q=0;
for(let i=0;i<t.length;i++){const ch=t[i];
if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=ch}
else if(ch=='"')q=1;else if(ch==sep){r.push(c);c=''}
else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';if(r.some(x=>x.trim()))R.push(r);r=[]}
else c+=ch}
r.push(c);if(r.some(x=>x.trim()))R.push(r);
const H=(R.shift()||[]).map(x=>x.trim());return R.map(a=>Object.fromEntries(H.map((h,i)=>[h,(a[i]||'').trim()])))}
function kind(n,rows){const h=Object.keys(rows[0]||{}).map(nk);if(h.some(k=>/^(marca|tecnologia|brazo|longitud_brazo|altura|altura_montaje)$/.test(k)))return'L';return/lum/i.test(n)?'L':'T'}
const toT=o=>{const c=String(pk(o,'codigo','codigo_transformador','transformador','trafo','id','numero','nro','no','nombre'));return c?{codigo:c,serie:pk(o,'serie','numero_serie','serial'),potencia:pk(o,'potencia','kva','potencia_kva'),direccion:pk(o,'direccion','ubicacion'),barrio:pk(o,'barrio','sector'),lat:num(pk(o,'latitud','lat')),lng:num(pk(o,'longitud','lng','lon')),raw:o}:null};
const toL=(o,fi,i)=>{const t=String(pk(o,'transformador','trafo','codigo_transformador','codigo')),s=String(pk(o,'serie','numero_serie','serial'));return{_k:t+'|'+s+'|'+fi+'-'+i,serie:s,trafo:t,marca:pk(o,'marca'),potencia:pk(o,'potencia','potencia_w'),tecnologia:pk(o,'tecnologia'),brazo:pk(o,'brazo','longitud_brazo'),altura:pk(o,'altura','altura_montaje'),lat:num(pk(o,'latitud','lat')),lng:num(pk(o,'longitud','lng','lon')),barrio:pk(o,'barrio'),raw:o}};
async function imp(files){const T=[],L=[],mode=$('#ck').value;let fi=0;
for(const f of files){fi++;let TT=[],LL=[];
if(/\.(csv|txt)$/i.test(f.name)||/csv/.test(f.type)){const rows=csv(dec(await f.arrayBuffer()));if(!rows.length)return alert('CSV vacío o sin filas de datos: '+f.name);(mode==='auto'?kind(f.name,rows):mode)==='L'?LL.push(...rows):TT.push(...rows)}
else{let j;try{j=JSON.parse(dec(await f.arrayBuffer()))}catch{return alert('Archivo inválido: '+f.name)}TT=j.transformadores||j.trafos||[];LL=j.luminarias||j.lums||[]}
TT.forEach(o=>{const t=toT(o);if(t)T.push(t)});LL.forEach((o,i)=>L.push(toL(o,fi,i)))}
if(!T.length&&!L.length)return alert('No se encontraron transformadores ni luminarias. Revise los encabezados del archivo.');
const replT=T.length>0;
if((S.trafos.length||S.inv.length)&&!confirm('Se reemplazará '+[replT&&'la lista de transformadores',L.length&&'el inventario de luminarias'].filter(Boolean).join(' y ')+'. Los registros de terreno se conservan.'))return;
const have=new Set(replT?T.map(t=>t.codigo):S.trafos.map(t=>t.codigo));
L.forEach(l=>{if(l.trafo&&!have.has(l.trafo)){have.add(l.trafo);T.push({codigo:l.trafo,serie:'',potencia:'',direccion:'',barrio:l.barrio,lat:null,lng:null})}});
if(replT)await clr('trafos');if(L.length)await clr('inv');
for(const t of T)await put('trafos',t);for(const l of L)await put('inv',l);await load();render();alert('Cargado: '+T.length+' transformadores, '+L.length+' luminarias.')}
</script>
<script>/* SERVICIO DE EXPORTACIÓN: paquete ZIP de entrega (registros.json, registros.csv, fotos/). */
async function exp(){if(!S.reg.length)return alert('No hay registros para exportar.');const F=[],enc=new TextEncoder();
F.push({n:'registros.json',d:enc.encode(JSON.stringify({app:'amarres-ap-terreno',esquema:ESQUEMA,app_version:APP_VERSION,exportado:new Date().toISOString(),usuario:S.usuario,registros:S.reg},null,1))});
const cols=['id','transformador','tipo','estado','serie','transformador_base','marca','potencia','tecnologia','brazo','altura','lat_original','lng_original','precision_m','fecha_gps','lat_ajustada','lng_ajustada','observaciones','fotos','tecnico','fecha_registro'];
const row=r=>[r.id,r.trafo,r.tipo,r.estado,r.serie,r.otroTrafo,r.marca,r.potencia,r.tecnologia,r.brazo,r.altura,r.gpsOrig?.lat,r.gpsOrig?.lng,r.gpsOrig?.acc,r.gpsOrig?.ts,r.gpsAdj?.lat,r.gpsAdj?.lng,r.obs,r.fotos.map(f=>f+'.jpg').join(' '),r.usuario,r.fecha].map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',');
F.push({n:'registros.csv',d:enc.encode('\ufeff'+[cols.join(','),...S.reg.map(row)].join('\r\n'))});
for(const r of S.reg)for(const id of r.fotos){const f=await get('fotos',id);if(f)F.push({n:'fotos/'+id+'.jpg',d:new Uint8Array(await f.blob.arrayBuffer())})}
const a=document.createElement('a');a.href=URL.createObjectURL(zip(F));a.download='levantamiento_'+(S.usuario||'tecnico').replace(/\W+/g,'_')+'_'+new Date().toISOString().slice(0,10)+'.zip';a.click()}
</script>
<script>/* INTERFAZ: navegación, vistas, formulario de registro, mapa y reglas de guardado. */

if(tp){const p=proyectar(v,tp,W,H);x.beginPath();x.moveTo(p.x,p.y-15);x.lineTo(p.x+14,p.y+11);x.lineTo(p.x-14,p.y+11);x.closePath();x.fillStyle='#d00000';x.fill();x.lineWidth=2;x.strokeStyle='#fff';x.stroke()}
if(MP.modo==='punto'){const pt=(q,col,r)=>{if(q){const p=proyectar(v,q,W,H);x.beginPath();x.arc(p.x,p.y,r,0,7);x.fillStyle=col;x.fill();x.lineWidth=2;x.strokeStyle='#fff';x.stroke()}};pt(d.gpsOrig,'#f08c00',7);pt(d.gpsAdj,'#d00000',8);pt(MP.ahora,'#0a58ca',7);
x.strokeStyle='#10202b';x.lineWidth=2;x.beginPath();x.moveTo(W/2-26,H/2);x.lineTo(W/2+26,H/2);x.moveTo(W/2,H/2-26);x.lineTo(W/2,H/2+26);x.stroke();x.beginPath();x.arc(W/2,H/2,5,0,7);x.strokeStyle='#d00000';x.stroke();
const mc=MP.o.querySelector('#mc');if(mc)mc.innerHTML='Mira: <b>'+v.lat.toFixed(6)+', '+v.lng.toFixed(6)+'</b> · zoom '+zoomDe(v).toFixed(1)+' · 1 px ≈ '+(111320/v.s).toFixed(2)+' m'}}
function tocarMapa(px,py){const{v,W,H,con}=MP;if(MP.modo==='punto'){const k=Math.cos(v.lat*Math.PI/180);v.lat-=(py-H/2)/v.s;v.lng+=(px-W/2)/(k*v.s);dibujarMapa();return}let b=null,bd=26;for(const z of con){const p=proyectar(v,z,W,H),dd=Math.hypot(p.x-px,p.y-py);if(dd<bd){bd=dd;b=z}}MP.sel=b;ficha();dibujarMapa()}
function ficha(){const f=MP.o.querySelector('#mf'),z=MP.sel;if(!z){f.hidden=true;return}const r=RM.get(z._k);f.hidden=false;
f.innerHTML=`<b>${esc(z.serie)}</b> <span class="chip ${r?r.estado:''}">${r?LBL[r.estado]:'Pendiente'}</span><div class=ms>Transformador ${esc(z.trafo)} · ${z.potencia?esc(z.potencia)+' W':'W —'} · ${esc(z.tecnologia)||'tecnología —'}<br>Coordenadas ${z.lat.toFixed(6)}, ${z.lng.toFixed(6)}${r&&r.obs?'<br>Novedad: '+esc(r.obs):''}</div><div class=row><button class=pri data-m=val>${r?'Ver / editar validación':'Validar'}</button></div>`}
function validarDesdeMapa(){const z=MP.sel,cod=MP.cod;if(!z)return;cerrarMapa();const r=RM.get(z._k);if(r){d=structuredClone(r);go('form',d.trafo)}else newForm(cod,'inventario',z)}
A.mapa=()=>abrirMapa(V.p);
function colocarPunto(){const v=MP.v;d.gpsAdj={lat:v.lat,lng:v.lng,ts:new Date().toISOString(),via:'mira'};cerrarMapa();info();draw()}
async function miGps(){const g=await gps();if(!g)return alert('No se obtuvo GPS. Active la ubicación.');MP.ahora=g;MP.v.lat=g.lat;MP.v.lng=g.lng;dibujarMapa()}
A.mira=()=>abrirMapa(d.trafo,'punto');
</script>
<script>/* PRIORIDAD 3 (preparación) — ÁREA DE CARTOGRAFÍA: calcula, a partir de las coordenadas del inventario, las zonas que debe cubrir el mapa offline
   (casco urbano + corredores rurales) como celdas de ~1,1 km con 1 celda de margen. Genera una región GeoJSON para extraer solo esas zonas. */
function zonasCartografia(P,celda=0.01){const S=new Set();
for(const p of P){const i=Math.floor(p.lat/celda),j=Math.floor(p.lng/celda);for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)S.add((i+a)+','+(j+b))}
const filas=new Map();for(const k of S){const[i,j]=k.split(',').map(Number);if(!filas.has(i))filas.set(i,[]);filas.get(i).push(j)}
const r6=v=>Math.round(v*1e6)/1e6,R=[];
for(const[i,js]of filas){js.sort((a,b)=>a-b);let s=js[0],u=s;for(let n=1;n<=js.length;n++){if(js[n]===u+1){u=js[n];continue}R.push({minLat:r6(i*celda),maxLat:r6((i+1)*celda),minLng:r6(s*celda),maxLng:r6((u+1)*celda)});s=js[n];u=s}}
return R}
function geojsonZonas(R){return{type:'FeatureCollection',features:[{type:'Feature',properties:{nombre:'area_cartografia_puerto_asis'},geometry:{type:'MultiPolygon',coordinates:R.map(r=>[[[r.minLng,r.minLat],[r.maxLng,r.minLat],[r.maxLng,r.maxLat],[r.minLng,r.maxLat],[r.minLng,r.minLat]]])}}]}}
const enColombia=p=>p.lat>-4.5&&p.lat<13.5&&p.lng>-79.5&&p.lng<-66.5;
let ZONAS=null;
A.area=()=>{const T=[...S.inv,...S.trafos],conC=T.filter(z=>z.lat!=null&&z.lng!=null),P=conC.filter(enColombia),raras=conC.length-P.length,sin=S.inv.filter(z=>z.lat==null||z.lng==null).length;
if(!P.length)return alert('El inventario cargado no tiene coordenadas válidas.');
ZONAS=zonasCartografia(P);const km=ZONAS.reduce((a,r)=>a+(r.maxLat-r.minLat)*111.32*(r.maxLng-r.minLng)*111.32*Math.cos((r.minLat+r.maxLat)/2*Math.PI/180),0),
b=[Math.min(...ZONAS.map(r=>r.minLng)),Math.min(...ZONAS.map(r=>r.minLat)),Math.max(...ZONAS.map(r=>r.maxLng)),Math.max(...ZONAS.map(r=>r.maxLat))];
$('#ar').innerHTML=`<div class=card><b>Área a cubrir: ≈ ${Math.round(km)} km²</b><small>${P.length} puntos con coordenadas · ${sin} luminarias sin coordenadas${raras?' · '+raras+' con coordenadas fuera de Colombia (ignoradas, revíselas)':''}</small><small>Extensión: ${b.map(v=>v.toFixed(3)).join(', ')} (lng mín, lat mín, lng máx, lat máx)</small><small>${ZONAS.length} franjas que siguen el casco urbano y los corredores.</small></div><div class=row><button data-a=areaGeo>Descargar región (GeoJSON)</button></div>`};
A.areaGeo=()=>{if(!ZONAS)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(geojsonZonas(ZONAS))],{type:'application/geo+json'}));a.download='area_cartografia.geojson';a.click()};
</script>
