<script>/* NÚCLEO: estado global, constantes y utilidades puras. */
/* Interruptores de funciones: false = oculta y sin efecto (el código y los datos guardados se conservan). */
const FUNCIONES={distanciaReferencia:false,cierreConPendientes:false,revisionSeries:false}; // cierreConPendientes: true permite cerrar un transformador con aviso aunque falten luminarias
const ESQUEMA=2,APP_VERSION='1.14.3'; // versión con validaciones, importación transaccional y tolerancia a errores // ESQUEMA: versión del contrato de datos (ver docs/ESQUEMA_DATOS.md)
const $=s=>document.querySelector(s),m=$('#m');
let db,S={trafos:[],inv:[],reg:[],proyectos:[],puntos:[],cierres:[],lotes:[],revisiones:[],ultimaExport:'',catMat:[],usuario:''},RM=new Map,V={v:'home',p:null,q:''},d=null,GP=null,ZOOM=0.0008;
const LBL={coincide:'Coincide',novedad:'Con novedad',no_encontrada:'No encontrada',nueva:'Nueva',otro_trafo:'De otro trafo',sin_serie:'Sin serie'};
const TIT={inventario:'Validar luminaria',nueva:'Luminaria nueva',otro_trafo:'Luminaria de otro transformador',sin_serie:'Luminaria sin serie legible'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>{if(v===null||v===undefined||String(v).trim()==='')return null;const z=String(v).trim().replace(',','.');if(!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(z))return null;const n=Number(z);return Number.isFinite(n)?n:null};
</script>
<script>/* DOMINIO: reglas de fotografías de una luminaria. Máximo 2 por luminaria; el archivo se nombra con la serie: PA0069_1, PA0069_2.
   Los nombres se calculan al mostrar/exportar (no al capturar), por eso siguen la serie aunque se corrija después. */
const MAX_FOTOS=2;
const limpioNombre=s=>String(s).trim().replace(/\s+/g,'').replace(/[^A-Za-z0-9_-]/g,'-');
function baseFoto(r){const s=String(r.serie||'').trim();return(r.tipo==='sin_serie'||!s||s==='SIN_SERIE')?'SINSERIE-'+r.id:limpioNombre(s)}
const nombreFoto=(r,i)=>baseFoto(r)+'_'+(i+1);
function asignarNombres(regs){const usados=new Set,res=new Map;for(const r of regs)res.set(r.id,r.fotos.map((_,i)=>{let n=nombreFoto(r,i);if(usados.has(n))n=baseFoto(r)+'-'+r.id+'_'+(i+1);usados.add(n);return n}));return res}
</script>
<script>/* DOMINIO: distancia en línea recta entre luminarias. Solo pueden ser referencia las luminarias VERIFICADAS:
   registro guardado cuya luminaria fue encontrada (no «no encontrada»). Las pendientes del inventario NO son referencia. */
function coordValida(p){return !!p&&Number.isFinite(Number(p.lat))&&Number.isFinite(Number(p.lng))&&Number(p.lat)>=-90&&Number(p.lat)<=90&&Number(p.lng)>=-180&&Number(p.lng)<=180}
function distM(a,b){if(!coordValida(a)||!coordValida(b))return null;const R=6371000,r=Math.PI/180,dl=(b.lat-a.lat)*r,dg=(b.lng-a.lng)*r,h=Math.min(1,Math.max(0,Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dg/2)**2));return 2*R*Math.asin(Math.sqrt(h))}
const ESTADOS_VERIFICADOS=new Set(['coincide','novedad','nueva','otro_trafo','sin_serie']);
const esVerificada=r=>!!r&&ESTADOS_VERIFICADOS.has(r.estado);
const nombreRef=r=>(r.tipo==='sin_serie'||!String(r.serie||'').trim()||r.serie==='SIN_SERIE')?'SIN SERIE ('+r.id+')':r.serie;
/* Coordenadas a usar y su incertidumbre estimada (m): ajustada ≈3 · GPS = precisión del GPS (o 5) · inventario ≈10 (valores orientativos). */
function coordsRegistro(r,invPorK){if(r.gpsAdj)return{lat:r.gpsAdj.lat,lng:r.gpsAdj.lng,fuente:'ajustada',err:3};
if(r.gpsOrig)return{lat:r.gpsOrig.lat,lng:r.gpsOrig.lng,fuente:'GPS',err:r.gpsOrig.acc!=null?r.gpsOrig.acc:5};
const z=r.invKey&&invPorK?invPorK(r.invKey):null;return z&&z.lat!=null&&z.lng!=null?{lat:z.lat,lng:z.lng,fuente:'inventario',err:10}:null}
function distanciaEntre(a,b){const m=distM(a,b);if(m==null)return{m:null,err:null,aviso:'Coordenadas inválidas o incompletas.'};const err=Math.hypot(a.err,b.err),av=[];if(m<2*err)av.push('La distancia es comparable al error de las coordenadas: poco confiable.');if(a.fuente==='inventario'||b.fuente==='inventario')av.push('Una coordenada viene del inventario y no se midió en campo.');return{m,err,aviso:av.join(' ')}}
function candidatasReferencia(regs,actualId,act,trafoActual,invPorK){const L=[];for(const r of regs){if(r.id===actualId||!esVerificada(r))continue;const c=coordsRegistro(r,invPorK);L.push({id:r.id,serie:nombreRef(r),trafo:r.trafo,mismo:r.trafo===trafoActual,estado:r.estado,coords:c,m:act&&c?distM(act,c):null})}
return L.sort((a,b)=>act?((a.m==null)-(b.m==null)||a.m-b.m):((b.mismo-a.mismo)||String(a.serie).localeCompare(String(b.serie),'es',{numeric:true})))}
function estadoSerieRef(q,inv,regs){q=String(q).trim().toUpperCase();if(!q)return null;const r=regs.find(x=>String(x.serie).toUpperCase()===q);if(r)return esVerificada(r)?'verificada':'no_encontrada';return inv.some(x=>String(x.serie).toUpperCase()===q)?'pendiente':null}
</script>
<script>/* DOMINIO: avance y cierre de un transformador. Una luminaria del inventario está «revisada» cuando tiene registro
   (coincide, con novedad o no encontrada). Solo se puede marcar completado cuando no queda ninguna pendiente. */
function resumenTransformador(cod,inv,regs){const L=inv.filter(x=>x.trafo===cod),keys=new Set(L.map(x=>x._k)),R=regs.filter(r=>r.trafo===cod||(r.tipo==='otro_trafo'&&r.invKey&&keys.has(r.invKey))),B=new Map(R.filter(r=>r.invKey).map(r=>[r.invKey,r]));
const rev=L.filter(x=>B.has(x._k)),ver=rev.filter(x=>esVerificada(B.get(x._k))).length,ct=t=>R.filter(r=>r.tipo===t).length;
return{total:L.length,revisadas:rev.length,pendientes:L.length-rev.length,verificadas:ver,noEncontradas:rev.length-ver,nuevas:ct('nueva'),otroTrafo:ct('otro_trafo'),sinSerie:ct('sin_serie'),novedad:R.filter(r=>r.estado==='novedad').length}}
function puedeCerrar(cod,inv,regs){const s=resumenTransformador(cod,inv,regs);return s.pendientes===0&&(s.total>0||s.nuevas+s.otroTrafo+s.sinSerie>0)}
function estadoTransformador(cod,inv,regs,cierre){if(cierre)return'Completado';const s=resumenTransformador(cod,inv,regs);if(!s.revisadas&&!s.nuevas&&!s.otroTrafo&&!s.sinSerie)return'Pendiente';return puedeCerrar(cod,inv,regs)?'Listo para cerrar':'En proceso'}
</script>
<script>/* DOMINIO: qué se exporta. Filtro por fecha de registro para no repetir información, y archivo de luminarias verificadas con coordenadas corregidas. */
function filtrarRegistros(regs,f){if(!f||f.modo==='todo')return regs.slice();
if(f.modo==='nuevo')return regs.filter(r=>!f.ultima||String(r.fecha)>f.ultima);
if(f.modo==='rango'){const a=f.desde?new Date(f.desde+'T00:00:00'):null,b=f.hasta?new Date(f.hasta+'T23:59:59.999'):null;return regs.filter(r=>{const t=new Date(r.fecha);return(!a||t>=a)&&(!b||t<=b)})}return regs.slice()}
/* Fila de una luminaria verificada con su coordenada corregida: ajustada > GPS > inventario. */
function filaVerificada(r,ik){if(!esVerificada(r))return null;const c=coordsRegistro(r,ik),z=r.invKey&&ik?ik(r.invKey):null;
return{id:r.id,transformador:r.trafo,tipo:r.tipo,estado:r.estado,serie:nombreRef(r),lat:c?c.lat:null,lng:c?c.lng:null,fuente:c?c.fuente:'sin_coordenadas',incertidumbre:c?c.err:null,lat_original:z&&z.lat!=null?z.lat:null,lng_original:z&&z.lng!=null?z.lng:null,fecha:r.fecha}}
function geojsonVerificadas(F){return{type:'FeatureCollection',features:F.filter(f=>f.lat!=null).map(f=>({type:'Feature',properties:{id:f.id,transformador:f.transformador,serie:f.serie,tipo:f.tipo,estado:f.estado,fuente_coordenada:f.fuente},geometry:{type:'Point',coordinates:[f.lng,f.lat]}}))}}
</script>
<script>/* DOMINIO: revisión de series repetidas. Un grupo (lote) de luminarias se convierte en órdenes de trabajo: una por serie, con todos los lugares
   (transformadores) donde aparece en el censo. En cada lugar el técnico registra qué encuentra; la conclusión se deduce de esos hallazgos. No modifica el inventario. */
const HALLAZGOS={encontrada:'Encontrada con esta serie',otra_serie:'Encontrada con otra serie',no_encontrada:'No encontrada'};
const normSerie=s=>String(s||'').trim().toUpperCase().replace(/\s+/g,'');
const ocKey=o=>o.invKey||('T:'+o.trafo);
const ocDe=z=>({trafo:z.trafo,invKey:z._k,lat:z.lat??null,lng:z.lng??null});
/* Series que aparecen más de una vez en el inventario (en distintos transformadores o en el mismo). */
function seriesRepetidas(inv){const M=new Map;for(const z of inv){const k=normSerie(z.serie);if(!k||k==='SIN_SERIE')continue;if(!M.has(k))M.set(k,[]);M.get(k).push(z)}
return[...M.values()].filter(a=>a.length>1).map(a=>({serie:String(a[0].serie).trim(),ocurrencias:a.map(ocDe)})).sort((a,b)=>a.serie.localeCompare(b.serie,'es',{numeric:true}))}
/* filas: [{serie, transformador?}]. Los lugares salen del inventario; un transformador escrito en el archivo que no lo tenga se agrega como «solo archivo». */
function ordenesDesdeLista(filas,inv){const por=new Map;for(const f of filas){const k=normSerie(f.serie);if(!k)continue;if(!por.has(k))por.set(k,{serie:String(f.serie).trim(),trafos:new Set()});if(f.transformador)por.get(k).trafos.add(String(f.transformador).trim())}
const ordenes=[],sinInventario=[];for(const[k,o]of por){const oc=inv.filter(z=>normSerie(z.serie)===k).map(ocDe);for(const t of o.trafos)if(!oc.some(c=>c.trafo===t))oc.push({trafo:t,invKey:null,lat:null,lng:null,soloArchivo:true});
if(oc.length)ordenes.push({serie:o.serie,ocurrencias:oc});else sinInventario.push(o.serie)}return{ordenes,sinInventario}}
function concluirOrden(orden,revs){const por=new Map(revs.map(r=>[r.ocKey,r])),rv=orden.ocurrencias.map(o=>({o,r:por.get(ocKey(o))})),h=rv.filter(x=>x.r),tot=rv.length;
if(h.length<tot)return{estado:h.length?'En proceso':'Pendiente',codigo:null,texto:'',revisadas:h.length,total:tot};
const en=h.filter(x=>x.r.hallazgo==='encontrada'),ot=h.filter(x=>x.r.hallazgo==='otra_serie'),no=h.filter(x=>x.r.hallazgo==='no_encontrada');let codigo,texto;
if(en.length>=2){codigo='distintas';texto='Hay luminarias distintas con la misma serie (error de censo o serie repetida de fábrica) en: '+en.map(x=>x.o.trafo).join(', ')+'.'}
else if(ot.length){codigo='error_serie';texto='La serie está mal registrada en el censo en: '+ot.map(x=>x.o.trafo+' (se lee '+x.r.serieLeida+')').join(', ')+'.'}
else if(en.length===1){codigo='misma';texto=no.length?'Es la misma luminaria, ubicada en '+en[0].o.trafo+'. El registro en '+no.map(x=>x.o.trafo).join(', ')+' está duplicado o mal asociado.':'Existe una sola luminaria con esa serie, en '+en[0].o.trafo+'.'}
else{codigo='ninguna';texto='No se encontró en ninguna ubicación.'}
return{estado:'Revisada',codigo,texto,revisadas:tot,total:tot}}
/* Una fila por lugar de cada orden (también los sin revisar). NM: Map id de revisión → nombres de foto. */
function filasRevision(lote,revs,NM){const rows=[];for(const o of lote.ordenes){const rs=revs.filter(r=>r.orden===o.id),c=concluirOrden(o,rs);
for(const oc of o.ocurrencias){const r=rs.find(x=>x.ocKey===ocKey(oc)),co=r?coordsRegistro(r):null;
rows.push({lote:lote.nombre,serie:o.serie,transformador:oc.trafo,estado_orden:c.estado,conclusion:c.codigo||'',conclusion_texto:c.texto,hallazgo:r?r.hallazgo:'sin_revisar',serie_leida:r?r.serieLeida:'',lat_original:oc.lat,lng_original:oc.lng,lat_gps:r&&r.gpsOrig?r.gpsOrig.lat:null,lng_gps:r&&r.gpsOrig?r.gpsOrig.lng:null,precision_m:r&&r.gpsOrig?r.gpsOrig.acc:null,lat_corregida:co?co.lat:null,lng_corregida:co?co.lng:null,fuente_coordenada:co?co.fuente:'',observaciones:r?r.obs:'',fotos:r&&NM&&NM.get(r.id)?NM.get(r.id).map(n=>n+'.jpg').join(' '):'',tecnico:r?r.usuario:'',fecha:r?r.fecha:''})}}return rows}
</script>
<script>/* DOMINIO: levantamiento de proyectos nuevos de iluminación (expansión). Un proyecto tiene puntos consecutivos (P001, P002…);
   cada punto es un poste existente, un poste nuevo requerido o una luminaria existente de referencia. */
const TIPOS_PUNTO={poste_existente:'Poste existente',poste_nuevo:'Poste nuevo requerido',luminaria_existente:'Luminaria existente (referencia)'};
const MATERIALES=['Concreto','Madera','Metálico','Fibra','Otro'];
const VIAS=['Vehicular','Peatonal','Ciclovía','Parque / zona recreativa','Rural / corredor','Otra'];
const DISPOSICIONES=['Unilateral','Bilateral','Bilateral alternada','Central doble','Otra'];
const etiquetaPunto=n=>'P'+String(n).padStart(3,'0');
const siguienteN=(puntos,pid)=>1+Math.max(0,...puntos.filter(p=>p.proy===pid).map(p=>p.n));
const codigoProyecto=nombre=>String(nombre||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,24)||'PROYECTO';
/* Distancia en línea recta al punto anterior (interdistancia). null si es el primero; m=null si falta ubicación en alguno. */
function distAnterior(punto,puntos,invPorK){const prev=puntos.filter(p=>p.proy===punto.proy&&p.n<punto.n&&p.id!==punto.id).sort((a,b)=>b.n-a.n)[0];if(!prev)return null;
const a=coordsRegistro(punto,invPorK),b=coordsRegistro(prev,invPorK);if(!a||!b)return{prev:prev.n,m:null};const x=distanciaEntre(a,b);return{prev:prev.n,m:Math.round(x.m*10)/10,errM:Math.round(x.err),aviso:x.aviso}}
/* Catálogo de materiales de la empresa. Las cantidades suministradas como ejemplo de otros proyectos NO son cantidades predeterminadas. */
const MATERIALES_BASE=[
['3003','LUMINARIA LED DE 35W','Unidad'],['3118','CABLE ENCAUCHETADO 2X16 AWG CU','Metro'],['3538','FOTOCELDA IP66','Unidad'],['3261','BRAZO GALVANIZADO 1 1/4\" X 1.5MT CAL 14','Unidad'],['3282','COLLARIN GRILLETE 6-7\" T3/8 U1 1/2','Unidad'],['3210','COLLARIN GRILLETE 9-10\" T3/8 U1 1/2','Unidad'],['3306','CONECTOR CDP-70 (8-3/0 , 16-8)','Unidad'],['4150','STICKER SERIE','Unidad'],['4151','STICKER POTENCIA','Unidad'],['3040','PROYECTOR LED DE 100W','Unidad'],['3544','BASE FOTOCELDA','Unidad'],['3620','POSTE EN FIBRA DE VIDRIO SECCIONADO DE 9X510','Unidad'],['3259','COLLARIN 1 SALIDA 6-7\" T5/8','Unidad'],['3237','PERCHA DE 1 PUESTO','Unidad'],['3415','AISLADOR TIPO CARRETO DE PORCELANA','Unidad'],['3109','CABLE AISLADO 6 AWG AL','Metro'],['3305','CONECTOR CDP-150 (8-300 , 12-2)','Unidad'],['3209','COLLARIN GRILLETE 7-8\" T5/8 U1 1/2','Unidad'],['3312','CONECTOR CDP 120 (4-300)','Unidad'],['3215','COLLARIN 1 SALIDA 7-8\" T5/8','Unidad']
];
const catalogoMaterialesBase=()=>MATERIALES_BASE.map(([codigo,item,unidad])=>({codigo,item,unidad}));
const normalizarCatalogoMateriales=(actual)=>{const out=catalogoMaterialesBase();for(const x of(actual||[])){const item=String(x.item||'').trim(),unidad=String(x.unidad||'Unidad').trim()||'Unidad',codigo=String(x.codigo||'').trim();if(!item)continue;const i=out.findIndex(z=>(codigo&&z.codigo===codigo)||(!codigo&&z.item.toLowerCase()===item.toLowerCase()&&z.unidad.toLowerCase()===unidad.toLowerCase()));if(i<0)out.push({codigo,item,unidad});}return out};
const numCant=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:NaN};
const materialesInvalidos=L=>(L||[]).filter(x=>!String(x.item||'').trim()||!(numCant(x.cant)>0));
function materialesBasicos(tipo,pot){const L=[];if(String(pot)==='35')L.push({codigo:'3003',item:'LUMINARIA LED DE 35W',cant:'1',unidad:'Unidad'});return L}

function buscarTrafos(L,q,max=6){q=String(q||'').toUpperCase().replace(/\s+/g,'');if(!q)return[];

if(!confirm('Se crearán '+R.ordenes.length+' orden(es) de trabajo.'+(R.sinInventario.length?'\n'+R.sinInventario.length+' serie(s) no existen en el inventario y se omiten: '+R.sinInventario.slice(0,5).join(', ')+(R.sinInventario.length>5?'…':''):'')+'\n¿Crear el grupo?'))return;
await crearLote(($('#ln').value||f.name.replace(/\.[^.]+$/,'')).trim(),'archivo',R.ordenes)}catch(err){alert('No se pudo leer el archivo: '+err.message)}}}
async function crearLote(nombre,origen,ordenes){const id='LT'+Date.now().toString(36);await put('lotes',{id,nombre,origen,creado:new Date().toISOString(),usuario:S.usuario,ordenes:ordenes.map((o,i)=>({id:id+'-'+String(i+1).padStart(3,'0'),serie:o.serie,ocurrencias:o.ocurrencias}))});await load();go('lote',id)}
function vLote(id){const l=S.lotes.find(x=>x.id===id);if(!l)return go('lotes');
m.innerHTML=`<div class=card><b>${esc(l.nombre)}</b><small>${l.ordenes.length} órdenes · ${l.origen==='duplicadas'?'generado desde series repetidas':'cargado desde archivo'}</small></div><div class=row><button class=pri data-a=lcsv>Exportar CSV de la revisión</button><button data-a=lzip>Exportar con fotos (ZIP)</button></div><div class=row><button class=dan data-a=ldel>Eliminar grupo</button></div>`+
l.ordenes.map(o=>{const c=estadoOrden(o);return`<div class=card data-a=ord data-id="${esc(o.id)}"><b>${esc(o.serie)}</b><span class=chip>${c.estado}</span><small>${o.ocurrencias.map(x=>esc(x.trafo)).join(' · ')} · ${c.revisadas}/${c.total} revisadas</small>${c.texto?`<small>${esc(c.texto)}</small>`:''}</div>`}).join('')}
function vOrden(id){const p=ordenPorId(id);if(!p)return go('lotes');const{o}=p,rs=revsDeOrden(id),c=concluirOrden(o,rs);
m.innerHTML=`<div class=card><b style="font-size:20px">${esc(o.serie)}</b><span class=chip>${c.estado}</span><small>${o.ocurrencias.length} lugar(es) donde aparece en el censo</small></div>${c.texto?`<div class=card style="border-left-color:var(--wa)"><b>Conclusión</b><small>${esc(c.texto)}</small></div>`:''}<p class=ms>Revise cada lugar: ¿existe una luminaria con esta serie?</p>`+
o.ocurrencias.map((oc,i)=>{const r=rs.find(x=>x.ocKey===ocKey(oc)),t=S.trafos.find(z=>z.codigo===oc.trafo)||{};return`<div class=card data-a=roc data-i=${i}><b>${esc(oc.trafo)}</b><span class=chip>${r?HALLAZGOS[r.hallazgo]:'Sin revisar'}</span><small>${esc(t.direccion)} ${esc(t.barrio)}${oc.soloArchivo?' · solo en el archivo':''}</small>${r&&r.hallazgo==='otra_serie'?`<small>Se lee: ${esc(r.serieLeida)}</small>`:''}</div>`}).join('')}
function vRForm(){m.innerHTML=`<div class=card><b>${esc(d.serieEsp)}</b><small>Serie esperada en el transformador ${esc(d.trafo)}</small></div><label>¿Qué encontró aquí?<select data-k=hallazgo>${Object.entries(HALLAZGOS).map(([k,v])=>`<option value=${k} ${d.hallazgo===k?'selected':''}>${v}</option>`).join('')}</select></label>
<label>Serie que se lee en la luminaria (si es otra)<input data-k=serieLeida value="${esc(d.serieLeida)}"></label><label>Observaciones<textarea data-k=obs rows=3>${esc(d.obs)}</textarea></label>${CAPTURA}<div class=row><button class=pri data-a=rsave>Guardar revisión</button>${S.revisiones.some(x=>x.id===d.id)?'<button class=dan data-a=rdel>Eliminar</button>':''}</div>`;enlazarCaptura();info();draw()}
A.lnew=()=>go('lnew');
A.lgen=async()=>{const R=seriesRepetidas(S.inv);if(!R.length)return alert('No hay series repetidas en el inventario cargado.');if(!confirm('Se encontraron '+R.length+' serie(s) repetida(s). ¿Crear el grupo de revisión?'))return;await crearLote('Series repetidas '+new Date().toISOString().slice(0,10),'duplicadas',R)};
A.lt=e=>go('lote',e.id);A.ord=e=>go('orden',e.id);
A.roc=e=>{const{l,o}=ordenPorId(V.p),oc=o.ocurrencias[+e.i],ex=revsDeOrden(o.id).find(r=>r.ocKey===ocKey(oc));
d=ex?structuredClone(ex):{id:'V'+Date.now().toString(36),rev:true,lote:l.id,orden:o.id,ocKey:ocKey(oc),serieEsp:o.serie,trafo:oc.trafo,serie:'REV-'+o.serie+'-'+oc.trafo,orig:oc.lat!=null?{lat:oc.lat,lng:oc.lng}:null,hallazgo:'encontrada',serieLeida:'',obs:'',fotos:[],gpsOrig:null,gpsAdj:null};go('rform',o.id)};
A.rsave=async()=>{if(d.hallazgo==='otra_serie'&&!String(d.serieLeida).trim())return alert('Escriba la serie que se lee en la luminaria.');const nf=d.hallazgo==='no_encontrada';
if(!nf&&!d.fotos.length)return alert('Tome al menos una foto.');if(!nf&&!(d.gpsOrig||d.gpsAdj)&&!confirm('Sin ubicación. ¿Guardar de todos modos?'))return;
const o=S.revisiones.find(x=>x.id===d.id);if(o)for(const f of o.fotos)if(!d.fotos.includes(f))await del('fotos',f);d.usuario=S.usuario;d.fecha=new Date().toISOString();await put('revisiones',d);await load();go('orden',d.orden)};
A.rdel=async()=>{if(!confirm('¿Eliminar esta revisión y sus fotos?'))return;const o=S.revisiones.find(x=>x.id===d.id);for(const f of new Set([...d.fotos,...(o?o.fotos:[])]))await del('fotos',f);await del('revisiones',d.id);await load();go('orden',d.orden)};
A.ldel=async()=>{const l=S.lotes.find(x=>x.id===V.p);if(!confirm('¿Eliminar el grupo «'+l.nombre+'» con sus revisiones y fotos?'))return;for(const r of S.revisiones.filter(x=>x.lote===l.id)){for(const f of r.fotos)await del('fotos',f);await del('revisiones',r.id)}await del('lotes',l.id);await load();go('lotes')};
const COLS_REV=['lote','serie','transformador','estado_orden','conclusion','conclusion_texto','hallazgo','serie_leida','lat_original_inventario','lng_original_inventario','lat_gps','lng_gps','precision_m','lat_corregida','lng_corregida','fuente_coordenada','observaciones','fotos','tecnico','fecha'];
const csvRevision=(l,R,NM)=>csvTabla(COLS_REV,filasRevision(l,R,NM).map(f=>[f.lote,f.serie,f.transformador,f.estado_orden,f.conclusion,f.conclusion_texto,f.hallazgo,f.serie_leida,f.lat_original,f.lng_original,f.lat_gps,f.lng_gps,f.precision_m,f.lat_corregida,f.lng_corregida,f.fuente_coordenada,f.observaciones,f.fotos,f.tecnico,f.fecha]));
A.lcsv=()=>{const l=S.lotes.find(x=>x.id===V.p),R=S.revisiones.filter(r=>r.lote===l.id);descargar(new Blob([csvRevision(l,R,asignarNombres(R))],{type:'text/csv;charset=utf-8'}),'revision_series_'+codigoProyecto(l.nombre)+'_'+new Date().toISOString().slice(0,10)+'.csv')};
A.lzip=async()=>{const l=S.lotes.find(x=>x.id===V.p),R=S.revisiones.filter(r=>r.lote===l.id),NM=asignarNombres(R),F=[{n:'revision_series.csv',d:new TextEncoder().encode(csvRevision(l,R,NM))}];
for(const r of R)for(let i=0;i<r.fotos.length;i++){const f=await get('fotos',r.fotos[i]);if(f)F.push({n:'fotos/'+NM.get(r.id)[i]+'.jpg',d:new Uint8Array(await f.blob.arrayBuffer())})}descargar(zip(F),'revision_series_'+codigoProyecto(l.nombre)+'_'+new Date().toISOString().slice(0,10)+'.zip')};
</script>
<script>/* INTERFAZ: pantalla de inicio (elegir modo), proyectos de levantamiento nuevo y sus puntos. Reutiliza la captura de GPS, fotos y mira de precisión. */
let PN=null;
const opts=(L,s)=>L.map(o=>`<option ${o===s?'selected':''}>${esc(o)}</option>`).join('');
const csvq=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
const otrosPuntos=()=>d&&d.proy?S.puntos.filter(z=>z.proy===d.proy&&z.id!==d.id).map(z=>coordsRegistro(z)).filter(Boolean):[];
const CAPTURA=`<div class=row><label class=btn id=bt style="margin:0"><span id=bn></span><input id=ph type=file accept="image/*" capture=environment hidden></label><button data-a=gps>Capturar GPS</button><button data-a=man>Escribir coordenadas</button></div>
<div id=th class=row></div><p id=gi class=ms></p><canvas id=cv width=340 height=300></canvas>
<div class=row><button data-a=zi>Acercar</button><button data-a=zo>Alejar</button><button data-a=ra>Quitar ajuste</button></div><button class="pri wide" data-a=mira>Ubicar con precisión (pantalla completa)</button>
<p class=ms>Toque el mapa para ubicar el punto donde realmente está. Naranja: GPS original · rojo: ajustada · verde: otros puntos del proyecto.</p>`;
function vHome(){m.innerHTML=`<div class="card big2" data-a=nav data-v=list><b>Verificar luminarias</b><small>Inventario existente: validar luminarias por transformador.</small><small>${S.trafos.length} transformadores · ${S.reg.length} registros</small></div>
<div class="card big2" data-a=nav data-v=plist><b>Levantamiento nuevo</b><small>Proyecto de expansión: levantar postes, redes y puntos de nueva iluminación.</small><small>${S.proyectos.length} proyectos · ${S.puntos.length} puntos</small>${FUNCIONES.revisionSeries?`
<div class="card big2" data-a=nav data-v=lotes><b>Revisión de series</b><small>Órdenes de trabajo para verificar series repetidas en el censo.</small><small>${S.lotes.length} grupo(s) · ${S.revisiones.length} revisión(es)</small></div>`:''}`}
function vPList(){m.innerHTML='<button class="pri wide" data-a=pnew>+ Nuevo proyecto de levantamiento</button>'+(S.proyectos.length?S.proyectos.slice().sort((a,b)=>b.creado.localeCompare(a.creado)).map(p=>`<div class=card data-a=pd data-p="${esc(p.id)}"><b>${esc(p.nombre)}</b>${p.orden?'<span class=chip>OT '+esc(p.orden)+'</span>':''}<small>${esc(p.barrio)}${p.zona?' · '+esc(p.zona):''} ${p.via?'· '+esc(p.via):''}</small><small>${S.puntos.filter(x=>x.proy===p.id).length} puntos · ${p.creado.slice(0,10)}</small></div>`).join(''):'<p class=ms>Aún no hay proyectos. Cree uno para empezar el levantamiento.</p>')}
function vPNew(){const p=PN;m.innerHTML=`<label>Nombre del proyecto<input data-pk=nombre value="${esc(p.nombre)}" placeholder="Ej. Expansión barrio X"></label><label>Fecha de solicitud<input type=date data-pk=fechaSol value="${esc(p.fechaSol)}"></label><label>Número de orden de trabajo<input data-pk=orden autocapitalize=characters value="${esc(p.orden)}"></label>
<label>Quien solicita<select data-pk=solicitante><option value="">— Seleccione —</option>${SOLICITANTES.map(o=>`<option value="${o}" ${o===p.solicitante?'selected':''}>${o}</option>`).join('')}</select></label><label>Nombre de la persona que solicita<input data-pk=solicNombre value="${esc(p.solicNombre)}"></label>
<label>Barrio<input data-pk=barrio value="${esc(p.barrio)}"></label><label>Zona<input data-pk=zona list=zl value="${esc(p.zona)}"><datalist id=zl><option value="Urbana"><option value="Rural"></datalist></label>
<label>Tipo de vía<select data-pk=via>${opts(VIAS,p.via)}</select></label><label>Ancho de calzada (m)<input data-pk=ancho inputmode=decimal value="${esc(p.ancho)}"></label><label>Disposición prevista<select data-pk=disp>${opts(DISPOSICIONES,p.disp)}</select></label>
<label>Descripción<textarea data-pk=desc rows=3>${esc(p.desc)}</textarea></label><div class=row><button class=pri data-a=psave>Guardar proyecto</button></div>`}
function vPDet(id){const p=S.proyectos.find(x=>x.id===id);if(!p)return go('plist');const L=S.puntos.filter(x=>x.proy===id).sort((a,b)=>a.n-b.n);
m.innerHTML=`<div class=card><b>${esc(p.nombre)}</b><small>${p.orden?'OT '+esc(p.orden)+' · ':''}${p.fechaSol?'Solicitud '+esc(p.fechaSol)+' · ':''}${p.solicitante?esc(p.solicitante)+(p.solicNombre?' — '+esc(p.solicNombre):''):'Solicitante sin registrar'}</small><small>${esc(p.barrio)}${p.zona?' · '+esc(p.zona):''} · ${esc(p.via)} · ${esc(p.disp)}${p.ancho?' · calzada '+esc(p.ancho)+' m':''}</small><small>${esc(p.desc)}</small></div>
<div class=row><button class=pri data-a=pnp>+ Nuevo punto</button><button data-a=pedit>Editar proyecto</button></div><div class=row><button data-a=pexp>Exportar proyecto (ZIP)</button><button class=dan data-a=pdel>Eliminar</button></div>${(()=>{const MC=consolidarMateriales(L);return'<h3>Materiales del proyecto</h3>'+(MC.length?MC.map(x=>`<div class=ms>${x.codigo?'<span class=chip>'+esc(x.codigo)+'</span> ':''}${esc(x.item)}: <b>${x.total} ${esc(x.unidad)}</b> · ${x.puntos} punto(s)</div>`).join(''):'<p class=ms>Aún sin materiales.</p>')})()}<h3>Puntos (${L.length})</h3>`+
L.map(x=>{const dp=distAnterior(x,S.puntos,invPorK);return`<div class=card data-a=pt data-id="${esc(x.id)}"><b>${etiquetaPunto(x.n)}</b><span class=chip>${esc(TIPOS_PUNTO[x.tipo])}</span><small>${esc(x.material)} ${x.altPoste?esc(x.altPoste)+' m':''} ${x.codPoste?'· '+esc(x.codPoste):''}</small><small>${dp?(dp.m!=null?dp.m+' m al '+etiquetaPunto(dp.prev):'sin ubicación para medir'):'primer punto'} · ${x.fotos.length} foto(s) · ${(x.materiales||[]).length} material(es)</small></div>`}).join('')}
function vPForm(){m.innerHTML=`<h3>${etiquetaPunto(d.n)}</h3><label>Tipo de punto<select data-k=tipo>${Object.entries(TIPOS_PUNTO).map(([k,v])=>`<option value=${k} ${d.tipo===k?'selected':''}>${v}</option>`).join('')}</select></label>
<label>Código o placa del poste<input data-k=codPoste value="${esc(d.codPoste)}"></label><label>Material del poste<select data-k=material>${opts(MATERIALES,d.material)}</select></label><label>Altura del poste (m)<input data-k=altPoste inputmode=decimal value="${esc(d.altPoste)}"></label>
<label>Red de baja tensión disponible<select data-k=redBT>${opts(['Sí','No','No se sabe'],d.redBT)}</select></label><label>Transformador de alimentación<input data-k=trafoAli list=dl value="${esc(d.trafoAli)}"><datalist id=dl>${S.trafos.slice(0,500).map(t=>`<option value="${esc(t.codigo)}">`).join('')}</datalist></label>
<label>Luminaria propuesta: potencia (W)<input data-k=pot inputmode=numeric value="${esc(d.pot)}"></label><label>Tipo de brazo<select data-k=brazo>${opts(['1.30 m','1.50 m','1.95 m','Collarín'],d.brazo)}</select></label><label>Altura de montaje (m)<input data-k=altMont value="${esc(d.altMont)}"></label>
<h3>Entorno de la vía</h3><label>Disposición de las luminarias<select data-k=disp>${opts(DISPOSICIONES,d.disp)}</select></label><label>Ancho de calzada (m)<input data-k=calzada inputmode=decimal value="${esc(d.calzada)}"></label>
<div class=row><label>Andén adyacente<select data-k=anAdyExiste>${opts(['Sin dato','Sí','No'],d.anAdyExiste)}</select></label><label>Ancho (m)<input data-k=anAdyAncho inputmode=decimal value="${esc(d.anAdyAncho)}"></label></div>
<div class=row><label>Andén opuesto<select data-k=anOpuExiste>${opts(['Sin dato','Sí','No'],d.anOpuExiste)}</select></label><label>Ancho (m)<input data-k=anOpuAncho inputmode=decimal value="${esc(d.anOpuAncho)}"></label></div>
<h3>Materiales de este punto</h3><div id=mt></div><label>Agregar material<select id=ma></select></label><div class=row><button data-a=mbas>Agregar luminaria LED 35W</button></div>
<label>Observaciones (árboles, redes, obstáculos)<textarea data-k=obs rows=3>${esc(d.obs)}</textarea></label>${CAPTURA}<div id=dp class=ms></div>
<div class=row><button class=pri data-a=ptsave>Guardar punto</button>${S.puntos.some(x=>x.id===d.id)?'<button class=dan data-a=ptdel>Eliminar</button>':''}</div>`;d.materiales=d.materiales||[];matUI();wireMat();enlazarCaptura();info();draw()}
function distPrev(){const e=$('#dp');if(!e)return;const x=distAnterior(d,S.puntos,invPorK);d.distPrev=x;
e.innerHTML=!x?'Primer punto del proyecto.':(x.m!=null?`Distancia al ${etiquetaPunto(x.prev)}: <b>${x.m} m</b> en línea recta (±${x.errM} m aprox.)${x.aviso?'<br><span style="color:var(--wa)">'+esc(x.aviso)+'</span>':''}`:`No se puede medir al ${etiquetaPunto(x.prev)}: falta ubicación en uno de los dos puntos.`)}
A.pnew=()=>{PN={id:'P'+Date.now().toString(36),nombre:'',fechaSol:'',orden:'',solicitante:'',solicNombre:'',zona:'',barrio:'',via:VIAS[0],ancho:'',disp:DISPOSICIONES[0],desc:'',creado:new Date().toISOString(),usuario:S.usuario};go('pnew')};
A.pedit=()=>{PN=structuredClone(S.proyectos.find(p=>p.id===V.p));go('pnew')};
A.psave=async()=>{if(!PN.nombre.trim())return alert('Escriba el nombre del proyecto.');PN.nombre=PN.nombre.trim();await put('proyectos',PN);await load();go('pdet',PN.id)};
A.pd=e=>go('pdet',e.p);
A.pnp=()=>{const p=S.proyectos.find(x=>x.id===V.p),n=siguienteN(S.puntos,p.id);d={id:'L'+Date.now().toString(36),proy:p.id,trafo:p.id,n,tipo:'poste_existente',serie:codigoProyecto(p.nombre)+'-'+etiquetaPunto(n),codPoste:'',material:MATERIALES[0],altPoste:'',redBT:'No se sabe',trafoAli:'',pot:'',brazo:'',altMont:'',obs:'',fotos:[],gpsOrig:null,gpsAdj:null,materiales:[],disp:p.disp,calzada:p.ancho,anAdyExiste:'Sin dato',anAdyAncho:'',anOpuExiste:'Sin dato',anOpuAncho:''};go('pform',p.id)};
A.pt=e=>{d=structuredClone(S.puntos.find(x=>x.id===e.id));d.materiales=(d.materiales||[]).map(x=>{const c=S.catMat.find(z=>(x.codigo&&z.codigo===x.codigo)||(!x.codigo&&z.item.toLowerCase()===String(x.item||'').toLowerCase()&&z.unidad.toLowerCase()===String(x.unidad||'').toLowerCase()));return{...x,codigo:x.codigo||c?.codigo||''}});go('pform',d.proy)};
A.ptsave=async()=>{const mi=materialesInvalidos(d.materiales);if(mi.length)return alert('Revise los materiales: '+mi.length+' con cantidad inválida (debe ser mayor que 0).');if(!(d.gpsOrig||d.gpsAdj)&&!confirm('Este punto no tiene ubicación. ¿Guardar de todos modos?'))return;const p=S.proyectos.find(x=>x.id===d.proy);d.serie=codigoProyecto(p.nombre)+'-'+etiquetaPunto(d.n);distPrev();

A.ptdel=async()=>{if(!confirm('¿Eliminar este punto y sus fotos?'))return;const o=S.puntos.find(x=>x.id===d.id);for(const f of new Set([...d.fotos,...(o?o.fotos:[])]))await del('fotos',f);await del('puntos',d.id);await load();go('pdet',d.proy)};

<script>/* PRIORIDAD 3 (preparación) — ÁREA DE CARTOGRAFÍA: calcula, a partir de las coordenadas del inventario, las zonas que debe cubrir el mapa offline
   (casco urbano + corredores rurales) como celdas de ~1,1 km con 1 celda de margen. Genera una región GeoJSON para extraer solo esas zonas. */
function zonasCartografia(P,celda=0.01){const S=new Set();
for(const p of P){const i=Math.floor(p.lat/celda),j=Math.floor(p.lng/celda);for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)S.add((i+a)+','+(j+b))}
const filas=new Map();for(const k of S){const[i,j]=k.split(',').map(Number);if(!filas.has(i))filas.set(i,[]);filas.get(i).push(j)}
const r6=v=>Math.round(v*1e6)/1e6,R=[];
for(const[i,js]of filas){js.sort((a,b)=>a-b);let s=js[0],u=s;for(let n=1;n<=js.length;n++){if(js[n]===u+1){u=js[n];continue}R.push({minLat:r6(i*celda),maxLat:r6((i+1)*celda),minLng:r6(s*celda),maxLng:r6((u+1)*celda)});s=js[n];u=s}}
return R}
function geojsonZonas(R){return{type:'FeatureCollection',features:[{type:'Feature',properties:{nombre:'area_cartografia_puerto_asis'},geometry:{type:'MultiPolygon',coordinates:R.map(r=>[[[r.minLng,r.minLat],[r.maxLng,r.minLat],[r.maxLng,r.maxLat],[r.minLng,r.maxLat],[r.minLng,r.minLat]]])}}]}}
const enColombia=p=>p.lat>-4.5&&p.lat<13.5&&p.lng>-79.5&&p.lng<-66.5;
let ZONAS=null;
A.area=()=>{const T=[...S.inv,...S.trafos],conC=T.filter(z=>z.lat!=null&&z.lng!=null),P=conC.filter(enColombia),raras=conC.length-P.length,sin=S.inv.filter(z=>z.lat==null||z.lng==null).length;
if(!P.length)return alert('El inventario cargado no tiene coordenadas válidas.');
ZONAS=zonasCartografia(P);const km=ZONAS.reduce((a,r)=>a+(r.maxLat-r.minLat)*111.32*(r.maxLng-r.minLng)*111.32*Math.cos((r.minLat+r.maxLat)/2*Math.PI/180),0),
b=[Math.min(...ZONAS.map(r=>r.minLng)),Math.min(...ZONAS.map(r=>r.minLat)),Math.max(...ZONAS.map(r=>r.maxLng)),Math.max(...ZONAS.map(r=>r.maxLat))];
$('#ar').innerHTML=`<div class=card><b>Área a cubrir: ≈ ${Math.round(km)} km²</b><small>${P.length} puntos con coordenadas · ${sin} luminarias sin coordenadas${raras?' · '+raras+' con coordenadas fuera de Colombia (ignoradas, revíselas)':''}</small><small>Extensión: ${b.map(v=>v.toFixed(3)).join(', ')} (lng mín, lat mín, lng máx, lat máx)</small><small>${ZONAS.length} franjas que siguen el casco urbano y los corredores.</small></div><div class=row><button data-a=areaGeo>Descargar región (GeoJSON)</button></div>`};
A.areaGeo=()=>{if(!ZONAS)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(geojsonZonas(ZONAS))],{type:'application/geo+json'}));a.download='area_cartografia.geojson';a.click()};
</script>

async function zipXlsx(buf){

  const xml=await read(path);if(!xml)continue;

    const type=cell.getAttribute('t'),v=cell.getElementsByTagName('v')[0]?.textContent??'';
    let value=type==='s'?shared[Number(v)]??'':type==='inlineStr'?[...cell.getElementsByTagName('t')].map(t=>t.textContent).join(''):type==='b'?v==='1':v;

}
function cSheetRows(sheet){
 if(!sheet||!sheet.rows.length)return [];
 let rows=sheet.rows;
 // Algunas exportaciones antiguas llegan con cada fila CSV distribuida en varias celdas.
 if(rows[0].filter(v=>v!==undefined&&v!==null&&v!=='').length===1&&String(rows[0][0]).includes(';')){
  const splitLine=line=>{const a=[];let q=false,c='';for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){c+='"';i++}else q=!q}else if(ch===';'&&!q){a.push(c);c=''}else c+=ch}a.push(c);return a};

 }

async function cReadXlsx(file){

// Lector CSV para Android y escritorio: detecta separador (; , o tab), BOM UTF-8,
// comillas escapadas y campos multilínea. Devuelve el mismo formato que el lector XLSX.
function cParseCsv(text){
 text=String(text??'').replace(/^\uFEFF/,'');
 const sample=text.split(/\r?\n/).filter(x=>x.trim()).slice(0,8);
 const candidates=[';',',','\t'];
 const countOutside=(line,sep)=>{let q=false,n=0;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"')i++;else q=!q}else if(ch===sep&&!q)n++}return n};
 const sep=candidates.map(d=>({d,n:sample.reduce((a,l)=>a+countOutside(l,d),0)})).sort((a,b)=>b.n-a.n)[0].d;

 for(let i=0;i<text.length;i++){
  const ch=text[i];
  if(ch==='"'){
   if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted;
  }else if(ch===sep&&!quoted){row.push(cell);cell='';}
  else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(v=>String(v).trim()!==''))rows.push(row);row=[];cell='';}
  else cell+=ch;
 }
 if(quoted)throw Error('El CSV contiene comillas sin cerrar. Vuelve a exportarlo como CSV UTF-8.');

}

}
const cCoords=r=>{let lat=cNum(cGet(r,'LATITUD','S_LATITUD')),rawLng=cGet(r,'LONGITUD','S_LONGITUD'),lng=cNum(rawLng);

function cDiff(oldL,newL,oldT,newT){
 const changes=[],oldById=new Map(oldL.map(x=>[String(x.id),x])),oldBySeries=new Map(),newSeriesCount=new Map(),seenOld=new Set();
 for(const x of oldL){const k=cNorm(x.serie);if(k){if(!oldBySeries.has(k))oldBySeries.set(k,[]);oldBySeries.get(k).push(x)}}
 for(const x of newL){const k=cNorm(x.serie);if(k)newSeriesCount.set(k,(newSeriesCount.get(k)||0)+1)}
 for(const n of newL){
  const sk=cNorm(n.serie),matches=sk?(oldBySeries.get(sk)||[]):[],uniqueSeries=matches.length===1&&newSeriesCount.get(sk)===1;

   seenOld.add(String(o.id));
   if(by==='serie'&&String(o.id)!==String(n.id)){
    changes.push({tipo:'id_cambiado_misma_serie',idAnterior:o.id,idActual:n.id,serie:n.serie,anterior:o,actual:n,diff:[{campo:'id',anterior:o.id,actual:n.id}],estado:'requiere_revision'});
   }else{

    const diff=fields.filter(k=>!cSameValue(k,o[k],n[k])).map(k=>({campo:k,anterior:o[k]??'',actual:n[k]??''}));

   }
   continue;
  }

   changes.push({tipo:'serie_ambigua',idAnterior:matches.map(x=>x.id).join(', '),idActual:n.id,serie:n.serie,anterior:matches,actual:n,diff:[],estado:'requiere_revision'});

 }

}

function cSummary(changes){const c={};for(const x of changes)c[x.tipo]=(c[x.tipo]||0)+1;return c}
function cOrderAnalysis(st){
 const inv=st.current?.luminarias||[],orders=st.orders||[],bySerie=new Map();
 for(const x of inv){const k=cNorm(x.serie);if(k){if(!bySerie.has(k))bySerie.set(k,[]);bySerie.get(k).push(x)}}
 const out=orders.map(o=>{
  const series=[o.serie,o.encontrada,o.retirada,o.instalada].map(cNorm).filter((v,i,a)=>v&&a.indexOf(v)===i);
  const exact=series.flatMap(k=>bySerie.get(k)||[]);
  const uniq=[...new Map(exact.map(x=>[x.id,x])).values()];
  if(uniq.length===1)return{orden:o.orden,fecha:o.fecha,trafo:o.trafo,serie:uniq[0].serie,id:uniq[0].id,tipo:'coincidencia_por_serie',distancia:null};
  if(uniq.length>1)return{orden:o.orden,fecha:o.fecha,trafo:o.trafo,serie:series.join(', '),id:uniq.map(x=>x.id).join(', '),tipo:'serie_ambigua',distancia:null};
  const p=coordValida({lat:o.lat,lng:o.lng})?{lat:o.lat,lng:o.lng}:null;
  if(p){let cand=inv.filter(x=>coordValida(x)&&(!o.trafo||!x.trafo||cNorm(x.trafo)===cNorm(o.trafo))).map(x=>({x,d:distM(p,x)})).filter(z=>z.d!=null&&z.d<=30).sort((a,b)=>a.d-b.d).slice(0,3);
   if(cand.length)return{orden:o.orden,fecha:o.fecha,trafo:o.trafo,serie:'',id:cand.map(z=>z.x.id).join(', '),tipo:'candidato_geografico_no_confirmado',distancia:cand.map(z=>Math.round(z.d)).join(', ')+' m'};
  }
  return{orden:o.orden,fecha:o.fecha,trafo:o.trafo,serie:series.join(', '),id:'',tipo:'sin_coincidencia',distancia:null}
 });
 const count={};out.forEach(x=>count[x.tipo]=(count[x.tipo]||0)+1);return{out,count};
}
function cEsc(v){return esc(String(v??''))}
function cRender(){
 const box=$('#censoResultado');if(!box)return;
 cGetState().then(st=>{
  const cur=st.current,changes=st.changes||[],sum=cSummary(changes);
  box.innerHTML=`<div class=card><b>Inventario oficial importado</b><small>${cur?esc(cur.fecha)+' · '+cur.luminarias.length+' luminarias · '+cur.trafos.length+' transformadores':'Aún no has importado un inventario oficial.'}</small><small>${st.orders?.length||0} órdenes históricas importadas</small></div>
  ${cur?`<h3>Comparación más reciente</h3><div class=row>${Object.entries(sum).map(([k,v])=>`<span class=chip>${esc(k.replaceAll('_',' '))}: ${v}</span>`).join('')}</div>`:''}
  <h3>Importar inventario oficial</h3><p class=ms>Selecciona el archivo de luminarias y, si lo tienes, el de transformadores. Se aceptan CSV y Excel. La importación crea una nueva versión y compara con la anterior; no modifica el inventario operativo ni los registros de campo.</p>
  <label>Excel de luminarias (.xlsx)<input id=cLum type=file accept="*/*" /></label>
  <label>Archivo de transformadores (.csv o .xlsx, opcional)<input id=cTrafo type=file accept="*/*" /></label>
  <button class=pri data-a=cImport>Importar y comparar inventario</button>
  <h3>Órdenes históricas</h3><p class=ms>Importa el Excel de operación general. Se guardan como antecedentes; no actualizan luminarias automáticamente.</p>
  <label>Archivo de órdenes (.csv o .xlsx)<input id=cOrders type=file accept="*/*" /></label>
  <button data-a=cImportOrders>Importar órdenes</button><div id=cOrderResults></div>
  ${changes.length?`<h3>Detalle de diferencias (${changes.length})</h3><div class=card><button data-a=cExport>Exportar diferencias CSV</button><button data-a=cShowChanges>Ver primeras 100 diferencias</button><div id=cChanges></div></div>`:''}`;
  const oa=cOrderAnalysis(st),ob=$('#cOrderResults');
  if(ob&&st.orders?.length)ob.innerHTML=`<h3>Cruce preliminar de órdenes</h3><p class=ms>Coincidencias por serie: ${oa.count.coincidencia_por_serie||0} · Series ambiguas: ${oa.count.serie_ambigua||0} · Candidatos geográficos (≤30 m): ${oa.count.candidato_geografico_no_confirmado||0} · Sin coincidencia: ${oa.count.sin_coincidencia||0}. Los candidatos geográficos nunca se asignan automáticamente.</p><button data-a=cShowOrderMatches>Ver primeras 100 coincidencias</button><div id=cOrderMatches></div>`;
 });
}
async function cImport(){
 const lf=$('#cLum')?.files?.[0],tf=$('#cTrafo')?.files?.[0];if(!lf)return alert('Selecciona el archivo de luminarias. El de transformadores es opcional.');
 try{
  const [ls,ts]=await Promise.all([cReadDataFile(lf),tf?cReadDataFile(tf):Promise.resolve([])]);
  const lsh=ls.find(x=>x.rows.length&&Object.keys(x.rows[0]).some(k=>cNorm(k)==='ID_LUM'))||ls[0];
  const tsh=ts.find(x=>x.rows.length&&Object.keys(x.rows[0]).some(k=>cNorm(k)==='ID_TRAFO'))||ts[0];
  const L=cInventory(lsh.rows,'L'),T=cInventory(tsh.rows,'T');
  if(!L.out.length)throw Error('No se encontraron registros con ID_LUM. Revisa la hoja y los encabezados.');
  if(L.dup.length||T.dup.length)throw Error('Hay IDs duplicados. No se importó para evitar ambigüedades. ID_LUM: '+L.dup.length+'; ID_TRAFO: '+T.dup.length);
  const st=await cGetState(),changes=st.current?cDiff(st.current.luminarias,L.out,st.current.trafos,T.out):[];
  const hist=[...(st.history||[]),{fecha:new Date().toISOString(),archivoL:lf.name,archivoT:tf.name,luminarias:L.out.length,trafos:T.out.length,duplicadasSerie:L.dupSeries.length}];
  st.history=hist;st.changes=changes;st.current={fecha:new Date().toISOString(),archivoL:lf.name,archivoT:tf.name,luminarias:L.out,trafos:T.out,alertas:{luminariasSinID:L.bad.length,trafosSinID:T.bad.length,seriesDuplicadas:L.dupSeries,transformadoresSinLuminarias:T.out.filter(t=>!L.out.some(l=>l.trafoId===t.id)).map(t=>t.id)}};
  await cSaveState(st);alert('Inventario importado: '+L.out.length+' luminarias y '+T.out.length+' transformadores. Diferencias detectadas: '+changes.length+'.');cRender();
 }catch(e){console.error(e);alert('No se importó el inventario: '+(e.message||e))}
}
async function cImportOrders(){
 const f=$('#cOrders')?.files?.[0];if(!f)return alert('Selecciona el archivo de órdenes.');
 try{
  const sheets=await cReadDataFile(f),sh=sheets.find(x=>x.rows.length&&Object.keys(x.rows[0]).some(k=>cNorm(k)==='S_NO_REPORTE'))||sheets[0];
  const matSh=sheets.find(x=>x.rows.length&&Object.keys(x.rows[0]).some(k=>cNorm(k)==='ORDEN')&&Object.keys(x.rows[0]).some(k=>cNorm(k)==='MATERIAL'));
  const mats=new Map();
  if(matSh)for(const r of matSh.rows){const no=String(cGet(r,'ORDEN')).trim();if(!no)continue;if(!mats.has(no))mats.set(no,[]);mats.get(no).push({material:String(cGet(r,'MATERIAL')).trim(),cantidad:String(cGet(r,'CANTIDAD')).trim(),tipo:String(cGet(r,'TIPO')).trim(),serie:String(cGet(r,'SERIE')).trim(),tecnologia:String(cGet(r,'TECNOLOGIA')).trim(),potencia:String(cGet(r,'POTENCIA')).trim(),codigo:String(cGet(r,'COD MAT')).trim()})}
  const rows=sh.rows.map(r=>{
   const orden=String(cGet(r,'S_NO_REPORTE')).trim();
   return{
   orden,fecha:String(cGet(r,'S_FECHA_REPORTE')).trim(),
   trafo:String(cGet(r,'S_TRAFO')).trim(),direccion:String(cGet(r,'S_DIRECCION')).trim(),barrio:String(cGet(r,'S_BARRIO')).trim(),
   serie:String(cGet(r,'S_NO_SERIE_LUM')).trim(),encontrada:String(cGet(r,'S_LUMINARIA_ENCONTRADA')).trim(),
   retirada:String(cGet(r,'S_LUMINARIA_RETIRADA')).trim(),instalada:String(cGet(r,'S_LUMINARIA_INSTALADA')).trim(),
   potenciaRetirada:String(cGet(r,'S_POTENCIA_RETIRADA')).trim(),potenciaInstalada:String(cGet(r,'S_POTENCIA_INSTALADA')).trim(),
   marcaEncontrada:String(cGet(r,'S_MARCA_ENCONTRADA')).trim(),marcaInstalada:String(cGet(r,'S_MARCA_INSTALADA')).trim(),
   lat:cCoords(r)?.lat??null,lng:cCoords(r)?.lng??null,observacion:String(cGet(r,'S_OBSERVACION_EJECUCION')).trim(),materiales:mats.get(orden)||[]
  }}).filter(x=>x.orden||x.serie||x.trafo);
  const st=await cGetState(),uniq=new Map((st.orders||[]).map(x=>[x.orden+'|'+x.fecha+'|'+x.trafo,x]));
  for(const x of rows){const k=x.orden+'|'+x.fecha+'|'+x.trafo;if(!uniq.has(k))uniq.set(k,x)}
  st.orders=[...uniq.values()];await cSaveState(st);
  alert('Órdenes importadas como antecedentes: '+rows.length+'; materiales asociados: '+[...mats.values()].reduce((a,x)=>a+x.length,0)+'. No se modificó el inventario.');cRender();
 }catch(e){console.error(e);alert('No se pudieron importar las órdenes: '+(e.message||e))}
}
function cExport(){
 cGetState().then(st=>{const rows=st.changes||[];const cols=['tipo','idAnterior','idActual','serie','estado','campos'];const lines=[cols.join(';'),...rows.map(x=>[x.tipo,x.idAnterior,x.idActual,x.serie,x.estado,(x.diff||[]).map(d=>d.campo+': '+d.anterior+' → '+d.actual).join(' | ')].map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';'))];const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='diferencias_censo.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)})
}
function cShowChanges(){
 cGetState().then(st=>{const b=$('#cChanges');if(!b)return;b.innerHTML=(st.changes||[]).slice(0,100).map(x=>`<div class=card><b>${esc(x.serie||'Sin serie')}</b><small>${esc(x.tipo.replaceAll('_',' '))} · ID anterior ${esc(x.idAnterior)} · ID actual ${esc(x.idActual)}</small>${(x.diff||[]).map(d=>`<small>${esc(d.campo)}: ${esc(d.anterior)} → ${esc(d.actual)}</small>`).join('')}</div>`).join('')||'<p class=ms>Sin diferencias.</p>'})
}

function cShowOrderMatches(){
 cGetState().then(st=>{const box=$('#cOrderMatches');if(!box)return;const rows=cOrderAnalysis(st).out;box.innerHTML=rows.slice(0,100).map(x=>`<div class=card><b>Orden ${esc(x.orden||'—')} · ${esc(x.fecha||'')}</b><small>${esc(x.tipo.replaceAll('_',' '))} · Trafo ${esc(x.trafo||'—')}</small><small>Serie: ${esc(x.serie||'—')} · ID candidato: ${esc(x.id||'—')} ${x.distancia?'· '+esc(x.distancia):''}</small><small>${esc((st.orders.find(o=>o.orden===x.orden)?.materiales||[]).map(m=>m.material+' × '+m.cantidad+(m.serie?' · '+m.serie:'')).join(' | '))}</small></div>`).join('')||'<p class=ms>Sin órdenes.</p>'})
}
function vCenso(){m.innerHTML=`<h3>Censo oficial y depuración</h3><p class=ms>Importa las exportaciones oficiales y compara versiones. La serie identifica la luminaria en campo; ID_LUM conserva la referencia administrativa. Ninguna diferencia se aplica automáticamente.</p><div id=censoResultado></div><button data-a=back>Volver a Datos</button>`;cRender()}

A.censoOpen=()=>go('censo');
A.cImport=cImport;A.cImportOrders=cImportOrders;A.cExport=cExport;A.cShowChanges=cShowChanges;A.cShowOrderMatches=cShowOrderMatches;
</script>
